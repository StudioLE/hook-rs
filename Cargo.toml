[package]
name = "hook-rs"
version = "0.0.0"
edition = "2024"
description = "Permission hooks for Claude Code with bash-aware command analysis"
license = "AGPL-3.0-only"
repository = "https://github.com/StudioLE/hook-rs"

[profile.release]
strip = true

[dependencies]
argh = { version = "0.1.19" }
brush-parser = { version = "0.4.0" }
dirs = { version = "6.0.0" }
globset = { version = "0.4.18" }
regex = { version = "1.12.3" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149" }
serde_yaml = { version = "0.9.34" }
studiole-di = { version = "0.5.1" }
studiole-logging = { version = "0.2.0" }
studiole-report = { version = "0.4.0", features = ["render"] }
thiserror = { version = "2.0.18" }
tracing = { version = "0.1.44" }

[dev-dependencies]
insta = { version = "1.47.2", features = ["yaml"] }
studiole-logging = { version = "0.2.0", features = ["testing"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
absolute_paths = "warn"
arithmetic_side_effects = "allow"
as_conversions = "warn"
await_holding_lock = "warn"
cast_possible_truncation = "warn"
clone_on_ref_ptr = "allow"
enum_glob_use = "allow"
expect_used = "allow"
explicit_iter_loop = "allow"
exhaustive_enums = "allow"
exhaustive_structs = "allow"
get_first = "warn"
if_not_else = "warn"
if_then_some_else_none = "warn"
implicit_return = "allow"
indexing_slicing = "warn"
integer_division = "warn"
just_underscores_and_digits = "allow"
match_same_arms = "warn"
missing_docs_in_private_items = "allow"
missing_errors_doc = "allow"
missing_inline_in_public_items = "allow"
missing_panics_doc = "allow"
mod_module_files = "allow"
module_inception = "allow"
module_name_repetitions = "allow"
needless_pass_by_value = "allow"
neg_multiply = "allow"
new_without_default = "allow"
non_ascii_literal = "allow"
panic = "warn"
pattern_type_mismatch = "allow"
pub_use = "allow"
question_mark_used = "allow"
result_large_err = "warn"
separated_literal_suffix = "allow"
shadow_reuse = "allow"
shadow_same = "allow"
shadow_unrelated = "allow"
single_call_fn = "allow"
std_instead_of_alloc = "allow"
std_instead_of_core = "allow"
str_to_string = "warn"
string_add = "allow"
tests_outside_test_module = "allow"
type_complexity = "allow"
unneeded_wildcard_pattern = "warn"
unreadable_literal = "allow"
unseparated_literal_suffix = "warn"
unused_self = "warn"
unwrap_used = "warn"
used_underscore_items = "allow"
wildcard_enum_match_arm = "allow"
wildcard_imports = "allow"
wrong_self_convention = "allow"

[lints.rust]
non_snake_case = "allow"

[lints.rustdoc]
bare_urls = "warn"
broken_intra_doc_links = "warn"
invalid_html_tags = "warn"
